name: Continuous Integration Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit and Integration Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.14'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt # Ensures all dependencies, including langchain, are present
    - name: Run Tests
      run: |
        # Setting PYTHONPATH ensures that the test runner can find the 'src' directory
        export PYTHONPATH=$PWD:$PYTHONPATH
        python -m unittest discover tests
